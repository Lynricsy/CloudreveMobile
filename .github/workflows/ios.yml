name: iOS

on: [push, pull_request, workflow_dispatch]

# 不取消进行中的运行：多个 iOS 分支任务会连续推送，每个提交都需要自己的结果
concurrency:
  group: ios-${{ github.sha }}
  cancel-in-progress: false

env:
  # UI 测试登录用的服务端版本与账号（与 iosApp/OpenCloudreveUITests 中一致）
  OCR_SERVER_REF: "4.19.12"
  OCR_TEST_EMAIL: user@example.com
  OCR_TEST_PASSWORD: User@12345
  # 普通用户（非管理员），用于确认管理入口对普通用户不可见
  OCR_MEMBER_EMAIL: member@example.com
  OCR_MEMBER_PASSWORD: Member@12345

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Lynricsy/OpenCloudreve
          ref: ${{ env.OCR_SERVER_REF }}
          path: server
          submodules: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Xcode 信息
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: 构建并启动 OpenCloudreve 服务端
        run: |
          # 只测 API：用只含 index.html 的占位前端代替子模块构建产物（go:embed 需要 assets.zip 存在）
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile("server/application/statics/assets.zip", "w") as z:
              z.writestr("assets/build/index.html", "<!doctype html><title>OpenCloudreve</title>")
          EOF
          SERVER_DIR="$RUNNER_TEMP/ocr-server"
          mkdir -p "$SERVER_DIR"
          (cd server && go build -o "$SERVER_DIR/cloudreve" .)
          cd "$SERVER_DIR"
          printf '[System]\nMode = master\nListen = :5212\n' > conf.ini
          nohup ./cloudreve -c conf.ini > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5212/api/v4/site/ping; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5212/api/v4/site/ping | grep -q "$OCR_SERVER_REF"
          RESP=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"email\":\"$OCR_TEST_EMAIL\",\"password\":\"$OCR_TEST_PASSWORD\"}" \
            http://127.0.0.1:5212/api/v4/user)
          echo "注册：$RESP"
          echo "$RESP" | grep -q '"code":0'
          # 新库首个注册用户即管理员；再注册一个普通用户作对照
          RESP=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"email\":\"$OCR_MEMBER_EMAIL\",\"password\":\"$OCR_MEMBER_PASSWORD\"}" \
            http://127.0.0.1:5212/api/v4/user)
          echo "注册普通用户：$RESP"
          echo "$RESP" | grep -q '"code":0'
      - name: 预置文件浏览测试数据
        # 照片（PNG 缩略图）、文档（65 个文件）等，供 FileBrowserUITests 使用
        run: python3 scripts/ci/seed-files.py
      - name: 预置预览测试素材
        # 「预览」目录：带 EXIF 的 jpg、mp4 + 同名 srt、两首 mp3、pdf、md、zip，供 ViewerUITests 使用
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 scripts/ci/seed-viewer-media.py
      - name: 预置分享与后台任务测试数据
        # 「归档/分享任务」目录：report.txt（2 个版本）、bundle-src/（压缩素材）、share-me.md，供 ShareTasksUITests 使用
        run: python3 scripts/ci/seed-share-tasks.py
      - name: 构建 KMP XCFramework
        run: ./scripts/build-ios-framework.sh debug
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: 选择模拟器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          cands = [(k, x) for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          cands.sort(key=lambda kv: kv[0], reverse=True)
          pick = next((x for k, x in cands if x['name'] == 'iPhone 17'), cands[0][1])
          print(pick['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: 构建并测试
        run: |
          set -o pipefail
          cd iosApp
          # 模拟器用 ad-hoc 签名（无需开发者团队）：完全不签名时 entitlements 不会写入，
          # Keychain 会以 -34018 拒绝一切访问，App Group 容器也取不到
          xcodebuild -project OpenCloudreve.xcodeproj -scheme OpenCloudreve \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/OpenCloudreve.xcresult \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            build test
      - name: iPad 布局与键盘快捷键截图
        # 只跑一个 UI 用例控制时长（与上一步共用 DerivedData，只增量构建）；iPhone 上该用例自动跳过
        if: success() || failure()
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          cands = [(k, x) for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPad')]
          cands.sort(key=lambda kv: kv[0], reverse=True)
          pick = next((x for k, x in cands if x['name'].startswith('iPad Pro 11')), cands[0][1])
          print(pick['udid'], pick['name'], file=sys.stderr)
          print(pick['udid'])
          ")
          # 先启动 iPad 模拟器并等开机完成再跑用例：否则模拟器随用例冷启动，开机期间的后台任务偶发拖住首个用例（登录后 App 数分钟无响应）
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          cd iosApp
          xcodebuild -project OpenCloudreve.xcodeproj -scheme OpenCloudreve \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath build/OpenCloudreve-iPad.xcresult \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:OpenCloudreveUITests/UIPolishUITests/testIPadLayoutAndKeyboardShortcuts \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            test
      - name: 导出截图
        if: always()
        run: |
          mkdir -p iosApp/build/screenshots
          if [ -d iosApp/build/OpenCloudreve.xcresult ]; then
            xcrun xcresulttool export attachments --path iosApp/build/OpenCloudreve.xcresult --output-path iosApp/build/screenshots || true
          fi
          mkdir -p iosApp/build/screenshots-ipad
          if [ -d iosApp/build/OpenCloudreve-iPad.xcresult ]; then
            xcrun xcresulttool export attachments --path iosApp/build/OpenCloudreve-iPad.xcresult --output-path iosApp/build/screenshots-ipad || true
          fi
          cp "$RUNNER_TEMP/ocr-server/server.log" iosApp/build/ || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-results
          path: |
            iosApp/build/OpenCloudreve.xcresult
            iosApp/build/screenshots
            iosApp/build/OpenCloudreve-iPad.xcresult
            iosApp/build/screenshots-ipad
            iosApp/build/server.log
