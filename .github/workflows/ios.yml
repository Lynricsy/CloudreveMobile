name: iOS

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: 选择 Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_26.0.app ]; then sudo xcode-select -s /Applications/Xcode_26.0.app; fi
          xcodebuild -version
      - name: 构建 KMP XCFramework
        run: ./scripts/build-ios-framework.sh debug
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: 选择模拟器
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];n=[x['name'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')];print('iPhone 17' if 'iPhone 17' in n else n[0])")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: 构建并测试
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project OpenCloudreve.xcodeproj -scheme OpenCloudreve \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath build/OpenCloudreve.xcresult \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build test
      - name: 导出截图
        if: always()
        run: |
          mkdir -p iosApp/build/screenshots
          if [ -d iosApp/build/OpenCloudreve.xcresult ]; then
            xcrun xcresulttool export attachments --path iosApp/build/OpenCloudreve.xcresult --output-path iosApp/build/screenshots || true
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-results
          path: |
            iosApp/build/OpenCloudreve.xcresult
            iosApp/build/screenshots
