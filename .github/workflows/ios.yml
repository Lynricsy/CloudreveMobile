name: iOS

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Xcode 信息
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun simctl list runtimes
      - name: 构建 KMP XCFramework
        run: ./scripts/build-ios-framework.sh debug
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: 选择模拟器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          cands = [(k, x) for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          cands.sort(key=lambda kv: kv[0], reverse=True)
          pick = next((x for k, x in cands if x['name'] == 'iPhone 17'), cands[0][1])
          print(pick['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: 构建并测试
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project OpenCloudreve.xcodeproj -scheme OpenCloudreve \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/OpenCloudreve.xcresult \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build test
      - name: 导出截图
        if: always()
        run: |
          mkdir -p iosApp/build/screenshots
          if [ -d iosApp/build/OpenCloudreve.xcresult ]; then
            xcrun xcresulttool export attachments --path iosApp/build/OpenCloudreve.xcresult --output-path iosApp/build/screenshots || true
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-results
          path: |
            iosApp/build/OpenCloudreve.xcresult
            iosApp/build/screenshots
