name: Android

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: 安装 Android 平台 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: 构建与测试
        run: ./gradlew :shared:allTests :shared:testAndroidHostTest :androidApp:assembleDebug :androidApp:testDebugUnitTest :androidApp:lintDebug --stacktrace
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-reports
          path: |
            shared/build/reports/
            androidApp/build/reports/
      - uses: actions/upload-artifact@v5
        with:
          name: opencloudreve-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
